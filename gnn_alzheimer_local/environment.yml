name: gnn_alzheimer
channels:
  - pytorch
  - pyg
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.12
  - networkx>=3.1
  - tqdm>=4.65
  # PyTorch — choose the right build for your hardware:
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - cpuonly   # remove this line if you have a CUDA GPU
  # PyG
  - pyg::pyg>=2.4.0
  # pip-only packages
  - pip
  - pip:
      - opencv-python>=4.8.0
      - torch-scatter>=2.1.0
      - torch-sparse>=0.6.18
      - reportlab>=4.0.0
      - python-docx>=1.0.0
